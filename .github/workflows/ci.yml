name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Dead code (knip)
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:coverage

      - name: Requirements traceability
        run: bun run check:traceability

      - name: Suite under exotic time zones (no local-time dependency)
        run: |
          for tz in Asia/Kathmandu Pacific/Chatham America/St_Johns Pacific/Kiritimati Etc/GMT+12; do
            echo "== $tz"
            TZ=$tz bun run test
          done

      - name: Build
        run: bun run build


      - name: Check package exports
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          bun run attw /tmp/astrotime-*.tgz --ignore-rules no-resolution cjs-resolves-to-esm

  conformance:
    name: Cross-engine conformance (V8 vs JSC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Digests must be bit-identical across engines
        run: |
          NODE_DIGEST=$(node scripts/conformance.mjs)
          BUN_DIGEST=$(bun scripts/conformance.mjs)
          echo "node: $NODE_DIGEST"
          echo "bun:  $BUN_DIGEST"
          test "$NODE_DIGEST" = "$BUN_DIGEST"

  node-compat:
    name: Node ${{ matrix.node-version }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile

      - name: Packed package smoke test
        run: bun run check:package
