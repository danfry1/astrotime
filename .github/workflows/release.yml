name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.repository == 'danfry1/astrotime'

    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG_NAME"

      - name: Verify signed commit and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.verification.verified')" = true
          TAG_OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" --jq '.verification.verified')" = true
          echo "RELEASE_COMMIT_VERIFIED=1" >> "$GITHUB_ENV"
          echo "RELEASE_TAG_VERIFIED=1" >> "$GITHUB_ENV"

      # Put the lockfile-pinned npm (a devDependency, integrity-checked by bun
      # install) ahead of the runner's bundled npm for the rest of the job.
      - name: Use repo-pinned npm
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Full release gate (format, lint, knip, typecheck, coverage, packed smoke)
        run: bun run check:release

      - name: Install independent reference implementation
        run: pip install astropy==6.0.1

      - name: Differential verification against ERFA/SOFA (100,000 epochs)
        run: bun run test:differential

      - name: Mutation verification from exact release inputs
        run: bun run test:mutation

      - name: Check package exports
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          bun run attw /tmp/astrotime-*.tgz --ignore-rules no-resolution cjs-resolves-to-esm

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > astrotime-sbom.cdx.json

      - name: Generate release-complete evidence bundle
        env:
          RELEASE_EVIDENCE: '1'
        run: bun run evidence

      - name: Archive evidence
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: tar -czf "astrotime-evidence-${TAG_NAME}.tgz" evidence

      - name: Attest evidence archive
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: astrotime-evidence-${{ github.ref_name }}.tgz

      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence
          path: evidence/

      - name: Upload attested evidence archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-archive
          path: astrotime-evidence-${{ github.ref_name }}.tgz

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: astrotime-sbom.cdx.json

      - name: Stage publish to npm
        # Uploads the tarball to npm's stage queue. Provenance is auto-generated
        # via OIDC trusted publishing. The version is NOT installable until a
        # maintainer approves it with a 2FA challenge:
        #   npm stage approve <id>   (or approve on npmjs.com)
        run: npm stage publish

      - name: Staged-publish approval reminder
        run: echo "::notice::Version staged to npm. Approve it (npm stage approve <id>, or on npmjs.com) with 2FA to make it installable."

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: Download evidence bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence

      - name: Download evidence archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-archive

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes astrotime-sbom.cdx.json "astrotime-evidence-${TAG_NAME}.tgz" evidence.json EVIDENCE.md SHA256SUMS
