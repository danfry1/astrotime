name: Extended verification (astropy differential, Hermes conformance)

on:
  schedule:
    - cron: '0 7 1 * *' # monthly
  workflow_dispatch:
    inputs:
      cases:
        description: Number of random instants to compare
        default: '100000'

permissions: read-all

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'danfry1/astrotime'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: pip install astropy==6.0.1

      - name: Compare against astropy (ERFA/SOFA)
        run: python3 scripts/differential.py "${{ inputs.cases || '100000' }}"

      - name: Conformance under Hermes (React Native engine)
        run: ./scripts/conformance-hermes.sh
