name: Extended verification (astropy differential, Hermes conformance)

on:
  schedule:
    - cron: '0 7 1 * *' # monthly
  workflow_dispatch:
    inputs:
      cases:
        description: Number of random instants to compare
        default: '100000'

permissions: read-all

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'danfry1/astrotime'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: pip install --require-hashes -r scripts/requirements-differential.txt

      - name: Compare against astropy (ERFA/SOFA)
        run: bun run build && python3 scripts/differential.py "${{ inputs.cases || '100000' }}" reports/differential/report.json && node scripts/stamp-differential.mjs

      - name: Upload differential report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-report
          path: reports/differential/

      - name: Conformance under Hermes (React Native engine)
        run: ./scripts/conformance-hermes.sh
