name: Leap-second table freshness

on:
  schedule:
    - cron: '0 6 1 * *' # monthly
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'danfry1/astrotime'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compare bundled table with IANA
        run: bun run scripts/check-leap-seconds.ts
